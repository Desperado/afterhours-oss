[package]
name = "afterhours-dsp"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Per-sample synth DSP for AFTERHOURS, compiled to WebAssembly for AudioWorklet."

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
