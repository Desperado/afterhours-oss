"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "bash scripts/setup.sh"
run_mode = "concurrent"

[scripts.run.desktop]
available_in = ["local"]
command = "npm run desktop"
default = true
icon = "play"

[scripts.run.build]
available_in = ["local"]
command = "npm run desktop:dist"
icon = "package"
